x-reset-data:
  # To reset data while keeping config and wallet, run:
  #   docker-compose down && docker-compose run --rm reset-data

services:
  reset-data:
    image: alpine:latest
    profiles: ["tools"]
    volumes:
      - ${DATA_DIR:-./data}:/data
    command: >
      sh -c "
        echo 'Resetting data (keeping config and wallet)...' &&
        rm -rf /data/yb /data/fgw /data/ipfs /data/carstage &&
        echo 'Done! Removed: yb, fgw, ipfs, carstage' &&
        echo 'Kept: config, wallet'
      "

  yugabyte:
    image: yugabytedb/yugabyte:2024.2.5.0-b59
    restart: unless-stopped
    volumes:
      - ${DATA_DIR:-./data}/yb:/root/var
    environment:
      YSQL_DB: filecoingw
      YCQL_KEYSPACE: filecoingw
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
      nproc: 12000
    # Conservative defaults for 16-32 GB machines. For large hosts (128+ GB),
    # increase db_block_cache_size_bytes (e.g. 17179869184 for 16 GiB) and
    # default_memory_limit_to_ram_ratio (e.g. 0.6).
    command: >
      bin/yugabyted start
        --background=false
        --advertise_address=yugabyte
        --tserver_flags=rocksdb_max_background_compactions=8,rocksdb_max_background_flushes=4,db_block_cache_size_bytes=536870912,tablet_server_svc_queue_length=10000
        --master_flags=default_memory_limit_to_ram_ratio=0.25
    healthcheck:
      test: >
        bin/ysqlsh -h yugabyte -U yugabyte -tAc 'select 1' -d yugabyte &&
        bin/ycqlsh yugabyte -e 'describe keyspaces'
      interval: 5s
      timeout: 5s
      retries: 10
  filecoingw:
    image: fgw:local
    restart: unless-stopped
    ports:
      - "443:8443"
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:2112:2112"
      - "8078:8078"
      - "127.0.0.1:9010:9010"
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
      nproc: 12000
    volumes:
      - ${DATA_DIR:-./data}/fgw/:/root/.ribsdata
      - ${DATA_DIR:-./data}/carstage:/root/.ribsdata/cardata
      - ${DATA_DIR:-./data}/wallet:/root/.ribswallet
      - ${DATA_DIR:-./data}/ipfs/:/root/.ipfs
    command: [ "sh", "-c", "if [ ! -f /root/.ipfs/config ]; then ./kuri init; fi; ./kuri daemon" ]
    env_file:
      - path: ${DATA_DIR:-./data}/config/settings.env
        required: false
    depends_on:
      yugabyte:
        condition: service_healthy
