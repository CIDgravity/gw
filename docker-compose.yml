x-reset-data:
  # To reset data while keeping config and wallet, run:
  #   docker-compose down && docker-compose run --rm reset-data

services:
  reset-data:
    image: alpine:latest
    profiles: ["tools"]
    volumes:
      - ${DATA_DIR:-./data}:/data
    command: >
      sh -c "
        echo 'Resetting data (keeping config and wallet)...' &&
        rm -rf /data/yb /data/fgw /data/ipfs &&
        echo 'Done! Removed: yb, fgw, ipfs' &&
        echo 'Kept: config, wallet'
      "

  yugabyte:
    image: yugabytedb/yugabyte:2024.2.5.0-b59
    volumes:
      - ${DATA_DIR:-./data}/yb:/root/var
    environment:
      YSQL_DB: filecoingw
      YCQL_KEYSPACE: filecoingw
    command: >
      bin/yugabyted start
        --background=false
        --advertise_address=yugabyte
    healthcheck:
      test: bin/ysqlsh -h `hostname -i` -U yugabyte -tAc 'select 1' -d yugabyte
      interval: 5s
      timeout: 5s
      retries: 10
  filecoingw:
    image: fgw:local
    ports:
      - "8443:8443"
      - "2112:2112"
      - "8078:8078"
      - "9010:9010"
    volumes:
      - ${DATA_DIR:-./data}/fgw/:/root/.ribsdata
      - ${DATA_DIR:-./data}/wallet:/root/.ribswallet
      - ${DATA_DIR:-./data}/ipfs/:/root/.ipfs
    command: [ "sh", "-c", "./kuri init ; ./kuri daemon" ]
    env_file:
      - ${DATA_DIR:-./data}/config/settings.env
    depends_on:
      yugabyte:
        condition: service_healthy