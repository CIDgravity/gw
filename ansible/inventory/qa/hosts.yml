---
# FGW QA Environment
# head (10.99.232.82) - YugabyteDB + S3 Proxy
# kuri1 (10.99.232.83) - Storage node
# kuri2 (10.99.232.84) - Storage node

all:
  children:
    # YugabyteDB (single-node for QA)
    yugabyte:
      hosts:
        fgw-qa-head:
          ansible_host: 10.99.232.82
      vars:
        yb_ysql_port: 5433
        yb_ycql_port: 9042

    # Kuri storage nodes
    kuri:
      hosts:
        fgw-ribs1:
          ansible_host: 10.99.232.83
          fgw_node_id: "kuri_01"
          ribs_data: /data/fgw
          kuri_localweb_port: 7010

        fgw-ribs2:
          ansible_host: 10.99.232.84
          fgw_node_id: "kuri_02"
          ribs_data: /data/fgw
          kuri_localweb_port: 7011

    # S3 frontend proxy on head node (routes to both kuri backends)
    s3_frontend:
      hosts:
        fgw-qa-head:
          fgw_node_id: "s3_proxy_01"
          s3_frontend_port: 8078

  vars:
    ansible_user: magik6k
    ansible_python_interpreter: /usr/bin/python3
