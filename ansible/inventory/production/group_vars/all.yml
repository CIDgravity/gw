---
# =============================================================================
# SHARED CONFIGURATION
# Populate these values from gwcfg output (settings.env)
# =============================================================================

# -----------------------------------------------------------------------------
# Binary Distribution
# -----------------------------------------------------------------------------
fgw_version: "latest"
fgw_binary_path: /opt/fgw/bin
fgw_config_path: /opt/fgw/config

# Download URL pattern (customize for your release server)
# Set to empty to skip download and expect binaries pre-installed
fgw_binary_url: ""
# fgw_binary_url: "https://releases.example.com/fgw/{{ fgw_version }}"

# -----------------------------------------------------------------------------
# Wallet Settings
# -----------------------------------------------------------------------------
fgw_wallet_source: "{{ playbook_dir }}/../files/wallet"
fgw_wallet_dest: /home/fgw/.ribswallet

# -----------------------------------------------------------------------------
# CIDGravity API (from gwcfg)
# IMPORTANT: Encrypt with ansible-vault!
# ansible-vault encrypt_string 'your-token' --name 'cidgravity_api_token'
# -----------------------------------------------------------------------------
cidgravity_api_token: "CHANGE_ME"
cidgravity_api_endpoint_gbap: "https://service.cidgravity.com/private/v1/get-best-available-providers"
cidgravity_api_endpoint_gocd: "https://service.cidgravity.com/private/v1/get-on-chain-deals"
cidgravity_max_connections: 4

# -----------------------------------------------------------------------------
# Filecoin API (from gwcfg)
# -----------------------------------------------------------------------------
ribs_filecoin_api_endpoint: "https://api.chain.love/rpc/v1"

# -----------------------------------------------------------------------------
# Deal Settings (from gwcfg)
# -----------------------------------------------------------------------------
ribs_minimum_replica_count: 5
ribs_maximum_replica_count: 10
ribs_minimum_retrievable_count: 5
ribs_retrievable_repair_threshold: 3
ribs_deal_start_time: 96
ribs_deal_duration: 530
ribs_deal_remove_unsealed: "false"
ribs_deal_skip_ipni_announce: "false"

# -----------------------------------------------------------------------------
# RIBS Settings
# -----------------------------------------------------------------------------
ribs_max_local_group_count: 64
ribs_max_staging_group_count: 0
ribs_deal_check_interval: "30s"
ribs_run_sp_crawler: "true"

# -----------------------------------------------------------------------------
# S3 API Settings
# -----------------------------------------------------------------------------
ribs_s3api_region: "EU"
ribs_s3api_auth_enabled: "false"
# Uncomment and set for production with auth:
# ribs_s3api_root_access_key_id: ""
# ribs_s3api_root_secret_key: ""

# -----------------------------------------------------------------------------
# LocalWeb (CAR file staging)
# -----------------------------------------------------------------------------
external_localweb_builtin_server: "true"
external_localweb_server_tls: "false"
external_localweb_max_concurrent_uploads_per_deal: 15

# -----------------------------------------------------------------------------
# Prometheus Metrics
# -----------------------------------------------------------------------------
ribs_prometheus_port: 2112

# -----------------------------------------------------------------------------
# Logging (format: subsystem:regex=level,subsystem:regex=level,...)
# Examples:
#   ".*:.*=info" - all subsystems at info level
#   "ribs:.*=debug,gw/.*=debug" - ribs and gw subsystems at debug
# -----------------------------------------------------------------------------
ribs_loglevel: ".*:.*=info"

# =============================================================================
# YUGABYTE CLUSTER SETTINGS
# =============================================================================

# SQL connection (first yugabyte host used as primary)
yb_ysql_host: "{{ groups['yugabyte'][0] }}"
yb_ysql_port: 5433
yb_ysql_user: "yugabyte"
yb_ysql_pass: "yugabyte"

# CQL connection (all hosts for load balancing)
yb_ycql_hosts: "{{ groups['yugabyte'] | map('extract', hostvars, 'ansible_host') | join(',') }}"
yb_ycql_port: 9042
yb_ycql_user: ""
yb_ycql_pass: ""

# Keyspace naming
# Per-node: filecoingw_{{ fgw_node_id | replace('-', '_') }}
# Shared S3: filecoingw_s3
yb_shared_s3_keyspace: "filecoingw_s3"
yb_replication_factor: 3

# =============================================================================
# SERVICE CONFIGURATION
# =============================================================================

# User/group for services
fgw_user: fgw
fgw_group: fgw

# Service restart policy
service_restart_sec: 10
service_timeout_stop_sec: 60
