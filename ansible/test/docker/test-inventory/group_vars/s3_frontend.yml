---
# =============================================================================
# S3 FRONTEND PROXY DEFAULTS
# =============================================================================

# Node identification
fgw_node_type: "frontend"

# -----------------------------------------------------------------------------
# Ports
# -----------------------------------------------------------------------------
s3_frontend_port: 8078
s3_frontend_internal_api_port: 9090

# -----------------------------------------------------------------------------
# Backend Configuration
# Auto-generated from kuri group in inventory
# Format: node_id:url,node_id:url,...
# -----------------------------------------------------------------------------
# This is computed at runtime from the kuri hosts
# fgw_backend_nodes will be set in the template

# -----------------------------------------------------------------------------
# YCQL for Object Routing (shared keyspace)
# -----------------------------------------------------------------------------
fgw_ycql_hosts: "{{ yb_ycql_hosts }}"
fgw_ycql_port: "{{ yb_ycql_port }}"
fgw_ycql_keyspace: "{{ yb_shared_s3_keyspace }}"

# -----------------------------------------------------------------------------
# Data Directories
# -----------------------------------------------------------------------------
fgw_config_dir: "/opt/fgw/config/{{ fgw_node_id }}"

# -----------------------------------------------------------------------------
# Service Management
# -----------------------------------------------------------------------------
s3_frontend_service_name: "s3-frontend-{{ fgw_node_id }}"

# -----------------------------------------------------------------------------
# Resource Limits
# -----------------------------------------------------------------------------
s3_frontend_max_memory: "4G"
s3_frontend_cpu_quota: 400  # 400% = 4 cores

# -----------------------------------------------------------------------------
# Health Check
# -----------------------------------------------------------------------------
s3_frontend_health_check_url: "http://127.0.0.1:{{ s3_frontend_port }}/healthz"
s3_frontend_health_check_timeout: 30
