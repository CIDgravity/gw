---
# Test inventory for Docker-based Ansible testing

all:
  children:
    # YugabyteDB - not managed via SSH, just referenced for connection info
    yugabyte:
      hosts:
        yb-test:
          ansible_host: 172.28.0.10
          ansible_connection: local  # Don't SSH to YB, just use for vars
      vars:
        yb_ysql_port: 5433
        yb_ycql_port: 9042

    kuri:
      hosts:
        kuri-01:
          ansible_host: 172.28.0.21
          fgw_node_id: "kuri-01"
          ribs_data: /data/fgw/kuri-01

        kuri-02:
          ansible_host: 172.28.0.22
          fgw_node_id: "kuri-02"
          ribs_data: /data/fgw/kuri-02

    s3_frontend:
      hosts:
        s3-fe-01:
          ansible_host: 172.28.0.31
          fgw_node_id: "s3-fe-01"

  vars:
    ansible_user: fgw
    ansible_password: fgwpass
    ansible_become_password: fgwpass
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
    ansible_python_interpreter: /usr/bin/python3
