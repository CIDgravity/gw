name: Build and publish docker containers

on:
  workflow_call:
    inputs:
      context:
        required: true
        type: string
        description: "context path for docker build"
      dockerfile:
        required: true
        type: string
        description: "path to the dockerfile"
      service:
        required: true
        type: string
        description: "service name"
      tag_override:
        required: false
        type: string


permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/aurorainfra/${{ inputs.service }}
          tags: |
            type=raw,value={{date 'YYYYMMDDHHmm'}}-{{sha}},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ inputs.tag_override }},enable=${{ inputs.tag_override != '' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
